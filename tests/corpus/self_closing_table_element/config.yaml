# A self-closing element that is itself a nested table path: it opens and closes
# a table scope within one event.
tables:
  - name: outer
    xml_path: /data
    levels: []
    fields:
      - {name: n, xml_path: /data/group/n, data_type: Int32, nullable: true}
  - name: inner
    xml_path: /data/group
    levels: [group]
    fields:
      - {name: v, xml_path: /data/group/item/v, data_type: Int32, nullable: true}
