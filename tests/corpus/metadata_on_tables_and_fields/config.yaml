# `metadata:` on a table and on its fields lands in the Arrow schema of every
# batch, collected, zero-copy or streamed, and not on the key columns the crate
# adds for `parent:`. Values are strings kept exactly as written: `revision:
# 1.50` stays "1.50".
version: 2
tables:
  - name: stations
    xml_path: /report/stations
    row: station
    metadata: {source: station export, revision: 1.50}
    fields:
      - {name: id, path: "@id", data_type: Utf8, metadata: {description: Station code}}
  - name: readings
    xml_path: /report/stations/station/readings
    row: reading
    links:
      - parent: stations
    fields:
      - {name: value, path: value, data_type: Float64, metadata: {unit: hPa}}
