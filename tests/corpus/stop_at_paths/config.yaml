parser_options:
  stop_at_paths: [/data/header]
tables:
  - name: header
    xml_path: /data/header
    levels: []
    fields:
      - {name: title, xml_path: /data/header/title, data_type: Utf8}
  - name: items
    xml_path: /data/items
    levels: []
    fields:
      - {name: v, xml_path: /data/items/item/v, data_type: Int32}
