# The version 2 counterpart of metadata_multi_child_rows: same document, same
# fields, with `row: "."` declaring the table element as the row. Comparing the
# two snapshots shows exactly what declaring the row buys — 2 half-filled rows
# become 1 complete one.
version: 2
tables:
  - name: header
    xml_path: /report/header
    row: "."
    fields:
      - {name: title, path: title, data_type: Utf8, nullable: true}
      - {name: created, path: created, data_type: Utf8, nullable: true}
