# Two features that pull against each other: strict unmatched-field detection
# reports every field that captured nothing, and `stop_at_paths` guarantees that
# everything below the stop path captures nothing. The report is still correct,
# but "check the xml_path spellings" is the wrong advice, so the message says so.
parser_options:
  stop_at_paths: [/data/header]
  error_on_unmatched_fields: true
tables:
  - name: header
    xml_path: /data/header
    levels: []
    fields:
      - {name: title, xml_path: /data/header/title, data_type: Utf8}
  - name: items
    xml_path: /data/items
    levels: []
    fields:
      - {name: v, xml_path: /data/items/item/v, data_type: Int32}
